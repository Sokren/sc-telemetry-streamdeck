<!doctype html>
<html>
	<head>
		<title>Actor Display</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<!-- Liste fournie par le plugin (événement « getValues »), libellés dans la langue du logiciel Stream Deck. -->
		<sdpi-item label="Donnée / Value">
			<sdpi-select setting="value" datasource="getValues" hot-reload default="oxygen"></sdpi-select>
		</sdpi-item>
		<sdpi-item>
			<p>
				Stream Deck + : tourner la molette change la donnée affichée. « — » : jeu fermé ou perso pas encore apparu.<br />
				Stream Deck +: rotate the dial to change the value. "—": game closed or character not spawned yet.
			</p>
		</sdpi-item>
	</body>
</html>
