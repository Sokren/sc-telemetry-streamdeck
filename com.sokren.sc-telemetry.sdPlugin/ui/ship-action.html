<!doctype html>
<html>
	<head>
		<title>Ship Action</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<!-- Liste fournie par le plugin (événement « getActions ») : commandes regroupées (on / off / bascule) en une ligne. -->
		<sdpi-item label="Action">
			<sdpi-select setting="action" datasource="getActions" hot-reload loading="…"></sdpi-select>
		</sdpi-item>
		<sdpi-item label="Mode">
			<sdpi-select setting="mode" default="toggle">
				<option value="toggle">Bascule / Toggle</option>
				<option value="on">Allumer / On</option>
				<option value="off">Éteindre / Off</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item>
			<p>
				Le mode s'applique aux fonctions regroupées (phares, train, VTOL, puissance…) ; il est ignoré pour les commandes simples.<br />
				The mode applies to grouped functions (lights, landing gear, VTOL, power…); it is ignored for single commands.
			</p>
		</sdpi-item>
	</body>
</html>
